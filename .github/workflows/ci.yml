# The four gates in AGENTS.md, on the three Python versions this tool claims to support, on
# the two platforms whose path semantics differ. Nothing here publishes: no upload, no
# deployment, no tag trigger. The build job installs the wheel it just made and runs it, so
# "the tests pass" and "the artefact someone would install works" are separate results.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  static:
    name: Format, lint, types
    runs-on: ubuntu-latest
    # Without this a hung install costs the platform default of six hours per job; the
    # whole suite measured 77 s on a clean venv with only the declared extras installed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # setup-python's pip cache key defaults to requirements files, of which this project
          # has none - every dependency is declared in pyproject.toml, so without this line the
          # cache is keyed on nothing and every run reinstalls the world.
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy dataset_doctor_audit

  tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Without this a hung install costs the platform default of six hours per job; the
    # whole suite measured 77 s on a clean venv with only the declared extras installed.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # The scale test is opt-in (tests/test_scale.py enables it only when this equals exactly
      # "1"), so a PR never pays for it. Its default shape is 50 000 train + 10 000 test files,
      # which measured 487.7 s cold on the authoring machine (2026-09-22) - eight minutes per
      # matrix cell is why it is not turned on here. `-rs` in the pytest step below is
      # what proves it was skipped on purpose rather than silently absent.
      DATASET_DOCTOR_SCALE: "0"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # setup-python's pip cache key defaults to requirements files, of which this project
          # has none - every dependency is declared in pyproject.toml, so without this line the
          # cache is keyed on nothing and every run reinstalls the world.
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -rA -v

  build:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    # Without this a hung install costs the platform default of six hours per job; the
    # whole suite measured 77 s on a clean venv with only the declared extras installed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # setup-python's pip cache key defaults to requirements files, of which this project
          # has none - every dependency is declared in pyproject.toml, so without this line the
          # cache is keyed on nothing and every run reinstalls the world.
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - name: Check both distributions before anyone can install them
        # `python -m build` makes a wheel and an sdist; PyPA's release flow is to validate both
        # metadata surfaces, because a README that fails to render or a licence file missing from
        # the archive is a packaging-index problem, not a Python problem.
        run: python -m twine check dist/*
      - name: Install the wheel in a clean environment and audit through it
        # The control fixture has to come out SAFE under --ci, which is the same claim
        # README makes about it, checked against the artefact instead of the source tree.
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --quiet --upgrade pip
          .ci-venv/bin/python -m pip install --quiet dist/*.whl
          .ci-venv/bin/dataset-doctor-audit --help
          .ci-venv/bin/dataset-doctor-audit audit examples/safe_tabular --ci -o .ci-report
      - name: Install the sdist the same way and audit through it too
        # The wheel is a file copy; the sdist is re-built by whoever installs it, so it is the
        # only one of the two that can ship a module the packaging forgot. Checking the wheel
        # alone leaves that class of bug in the release.
        run: |
          python -m venv .ci-venv-sdist
          .ci-venv-sdist/bin/python -m pip install --quiet --upgrade pip
          .ci-venv-sdist/bin/python -m pip install --quiet dist/*.tar.gz
          .ci-venv-sdist/bin/dataset-doctor-audit --help
          .ci-venv-sdist/bin/dataset-doctor-audit audit examples/safe_tabular --ci -o .ci-report-sdist
      - uses: actions/upload-artifact@v4
        with:
          name: dataset-doctor-audit-dists
          path: dist/
          retention-days: 14
          if-no-files-found: error
