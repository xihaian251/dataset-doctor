name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-dataset-doctor-audit-0.1.0 to confirm this production release.
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build the frozen release commit
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-dataset-doctor-audit-0.1.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 31200147cc8c9d2cd51c4bd58a1c17004c6fcbb2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen source and clean checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '31200147cc8c9d2cd51c4bd58a1c17004c6fcbb2'
          test -z "$(git status --porcelain)"
          python -c 'import tomllib; p=tomllib.load(open("pyproject.toml", "rb"))["project"]; assert p["name"] == "dataset-doctor-audit" and p["version"] == "0.1.0"'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Require exact TestPyPI-verified distributions
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          sha256sum dist/*
          printf '%s\n' \
            '40afbefd26c9bafe6ca70c3e7dc60072f2a0318c9d6e1defd0634ba6c00425fe  dist/dataset_doctor_audit-0.1.0-py3-none-any.whl' \
            '5111390aa583b1766bcd6e6c0745a143bf04352038a7b431a66a43bcc52edf11  dist/dataset_doctor_audit-0.1.0.tar.gz' \
            | sha256sum --check --strict
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-frozen-0.1.0-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the verified distributions
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-dataset-doctor-audit-0.1.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-frozen-0.1.0-distributions
          path: dist/
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
