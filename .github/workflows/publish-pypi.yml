name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-dataset-doctor-audit-0.1.1 to confirm this production release.
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build the frozen release commit
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-dataset-doctor-audit-0.1.1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6ba94129566ba86fd53a1a0e09dc03fd77144328
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen source and clean checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '6ba94129566ba86fd53a1a0e09dc03fd77144328'
          test -z "$(git status --porcelain)"
          python -c 'import tomllib; p=tomllib.load(open("pyproject.toml", "rb"))["project"]; assert p["name"] == "dataset-doctor-audit" and p["version"] == "0.1.1"'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Require exact TestPyPI-verified distributions
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          sha256sum dist/*
          printf '%s\n' \
            'e99593b2af3d065945cef9479ee833ed38d1999d0816c30a074d21e828c35b10  dist/dataset_doctor_audit-0.1.1-py3-none-any.whl' \
            'd1d2b43388a782594f259e27927876838c4e5acabd7ae6754b505215492f710e  dist/dataset_doctor_audit-0.1.1.tar.gz' \
            | sha256sum --check --strict
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-frozen-0.1.1-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the verified distributions
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-dataset-doctor-audit-0.1.1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-frozen-0.1.1-distributions
          path: dist/
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
