name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-dataset-doctor-audit-0.1.2 to confirm this production release.
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build the frozen release commit
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-dataset-doctor-audit-0.1.2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 107504ed7d2f0caffea9dbc28ec25225a532fdb0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen source and clean checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '107504ed7d2f0caffea9dbc28ec25225a532fdb0'
          test -z "$(git status --porcelain)"
          python -c 'import tomllib; p=tomllib.load(open("pyproject.toml", "rb"))["project"]; assert p["name"] == "dataset-doctor-audit" and p["version"] == "0.1.2"'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Require exact TestPyPI-verified distributions
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          sha256sum dist/*
          printf '%s\n' \
            '3d7c73572d09985715de8af51dbe9e45c266a1dcee3829f823fc89dc084a9f1d  dist/dataset_doctor_audit-0.1.2-py3-none-any.whl' \
            'd785c10a2f5f6f04d57d64a0d955e4c2afe386a81133517029900342a8f82ecb  dist/dataset_doctor_audit-0.1.2.tar.gz' \
            | sha256sum --check --strict
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-frozen-0.1.2-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the verified distributions
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-dataset-doctor-audit-0.1.2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-frozen-0.1.2-distributions
          path: dist/
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
