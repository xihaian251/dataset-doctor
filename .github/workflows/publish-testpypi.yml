name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Record distribution SHA256 hashes
        run: sha256sum dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: testpypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the checked distributions
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: testpypi
      url: https://test.pypi.org/project/dataset-doctor-audit/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: testpypi-distributions
          path: dist/
      - name: Confirm downloaded distribution SHA256 hashes
        run: sha256sum dist/*
      - name: Publish to TestPyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
