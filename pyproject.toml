[build-system]
# hatchling >= 1.26 is the first release that understands the PEP 639 `license` expression
# used below; an older backend would silently mis-read it.
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
# Distribution, import package and console script are all suffixed `-audit` on purpose.
# `dataset-doctor` is already taken on PyPI by an unrelated tabular auto-cleaning package
# (MIT, 1.0.1, uploaded 2026-03-25, github.com/Mirdula18/dataset-doctor), which ships the
# top-level import package `dataset_doctor` and the console script `dataset-doctor`; sharing
# either of those namespaces means two wheels overwrite each other's files in one
# site-packages. `dataset-doctor-audit` / `dataset_doctor_audit` collides with nothing.
# Brand-level artifacts keep the short name: the config file is `dataset-doctor.yaml`, the
# per-dataset workdir is `.dataset-doctor/`, and the default report dir is
# `dataset-doctor-report/`. See docs/adr/0006.
name = "dataset-doctor-audit"
version = "0.1.0"
description = "Detect data leakage before it corrupts your ML experiment. Local-first ML dataset reliability and leakage auditing CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Dataset Doctor contributors" }]
keywords = [
    "data-leakage",
    "dataset",
    "machine-learning",
    "data-quality",
    "audit",
    "reproducibility",
    "distribution-shift",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    # No `License ::` classifier: with the PEP 639 `license` expression above it is the
    # deprecated spelling of the same fact, and modern backends reject the pair.
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "Pillow>=10.2",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
image = ["imagehash>=4.3"]
excel = ["openpyxl>=3.1"]
dev = [
    "imagehash>=4.3",
    "openpyxl>=3.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

# The repository these URLs point at was created on 2026-09-22, which is the precondition the
# earlier "add them when the repo is real" note asked for. It is public and empty: nothing has been
# pushed to it yet, so these links resolve to a repository that carries no content until the release
# push. See docs/adr/0006 and docs/RELEASE_CHECKLIST.md section 3.
[project.urls]
Homepage = "https://github.com/xihaian251/dataset-doctor"
Repository = "https://github.com/xihaian251/dataset-doctor"
Issues = "https://github.com/xihaian251/dataset-doctor/issues"

[project.scripts]
dataset-doctor-audit = "dataset_doctor_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dataset_doctor_audit"]

[tool.hatch.build.targets.sdist]
# An explicit list means exactly that: anything not named is absent from the archive, and
# Apache-2.0 section 4 requires the licence text to travel with a redistributed work.
include = [
    "dataset_doctor_audit",
    "docs",
    "examples",
    "tests",
    ".github",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "AGENTS.md",
    "ROADMAP.md",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".dataset-doctor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "PLE", "RUF"]
ignore = [
    "RET504",
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM108",
    "B008",    # typer.Option(...) in defaults is the documented Typer idiom
    "UP045",   # Optional[X] is what Typer's annotation parser reads reliably
    "UP042",   # str+Enum on purpose: the values serialise into JSON reports as-is
    "PTH105",  # os.replace is atomic on every platform; Path.replace wraps the same call
    "PTH123",  # builtin open() gives the buffering and newline control the writers need
    "ARG001",  # detectors share one signature (ctx) even when a rule ignores it
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PTH", "S101"]
# The warnings filter in __init__ has to be installed before .models is imported.
"dataset_doctor_audit/__init__.py" = ["E402"]
# Markdown and HTML payload lines cannot be wrapped without changing the rendered text.
"dataset_doctor_audit/demo.py" = ["E501"]
"dataset_doctor_audit/reports/html.py" = ["E501"]
"dataset_doctor_audit/reports/markdown.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["dataset_doctor_audit"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
